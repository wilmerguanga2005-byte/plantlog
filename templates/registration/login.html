{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso · MES UPEC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'mes/css/mes.css' %}" rel="stylesheet"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--ink)">
<form method="post" class="card-ebr p-4" style="width:340px">{% csrf_token %}
  <h1 class="h5 mb-1">MES · UPEC</h1><p class="text-secondary small">Registro electrónico de lote — ingreso de personal</p>
  {% if form.errors %}<div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>{% endif %}
  <label class="form-label small">Usuario</label><input name="username" class="form-control mb-2" autofocus required>
  <label class="form-label small">Contraseña</label><input name="password" type="password" class="form-control mb-3" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-success w-100">Ingresar</button>
</form></body></html>
